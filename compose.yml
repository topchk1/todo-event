services:
  mongo:
    image: cacher.odds.team/docker/mongo:8
    container_name: todoe-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: todoe
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  rabbitmq:
    image: cacher.odds.team/docker/rabbitmq:3-management
    container_name: todoe-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: cacher.odds.team/docker/mysql:8
    container_name: todoe-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: todoe_onboarding
      MYSQL_USER: todoe
      MYSQL_PASSWORD: todoe
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  loki:
    image: cacher.odds.team/docker/grafana/loki:latest
    container_name: todoe-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: cacher.odds.team/docker/grafana/grafana:latest
    container_name: todoe-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning
    depends_on:
      - loki

  audit:
    build:
      context: .
      dockerfile: cmd/audit/Dockerfile
    container_name: todoe-audit
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      LOKI_URL: http://loki:3100
    depends_on:
      rabbitmq:
        condition: service_healthy

  credit:
    build:
      context: .
      dockerfile: cmd/credit/Dockerfile
    container_name: todoe-credit
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  welcome:
    build:
      context: .
      dockerfile: cmd/welcome/Dockerfile
    container_name: todoe-welcome
    restart: unless-stopped
    environment:
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      rabbitmq:
        condition: service_healthy

  captcha:
    build:
      context: .
      dockerfile: cmd/captcha/Dockerfile
    container_name: todoe-captcha
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      MONGO_URI: mongodb://root:root@mongo:27017
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mongo-data:
  grafana-data:
  rabbit-data:
  mysql-data:
